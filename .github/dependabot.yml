version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows current. Dependabot
  # understands the "@<sha> # v4" convention and bumps both the SHA and the
  # trailing version comment when a new release ships.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # Batch all action bumps into a single PR to keep the noise down.
      github-actions:
        patterns:
          - "*"
