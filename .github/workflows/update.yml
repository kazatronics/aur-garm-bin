name: Update AUR Package

on:
  push:
    branches:
      - master
    paths:
      - 'PKGBUILD'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update (skip version check)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --repo cloudbase/garm --json tagName -q .tagName)
          LATEST="${LATEST#v}"
          CURRENT=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New release found: $LATEST (current: $CURRENT)"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Already up to date: $CURRENT"
          fi
          # Deploy on a real version bump, a forced dispatch, or any manual
          # push of PKGBUILD (a pkgrel repackage). The bot's own commits carry
          # [skip ci], so they never re-trigger this workflow.
          if [ "$LATEST" != "$CURRENT" ] || [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # Only a real upstream version change rewrites pkgver and resets pkgrel
      # to 1. A forced run or a manual push must NOT touch these — that would
      # clobber a hand-made pkgrel bump (a repackage of the same upstream).
      - name: Update PKGBUILD version
        if: steps.check.outputs.update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Update checksums and generate .SRCINFO
        if: steps.check.outputs.deploy == 'true'
        uses: heyhusen/archlinux-package-action@3f7aaada28c782497bfe02d6d6ea365b25fdea12 # v3.0.1
        with:
          path: .
          updpkgsums: true
          srcinfo: true
          namcap: false
          flags: ''

      - name: Commit and tag
        id: pkg
        if: steps.check.outputs.deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pkgver=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          pkgrel=$(grep '^pkgrel=' PKGBUILD | cut -d= -f2)
          ver="${pkgver}-${pkgrel}"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::No file changes to commit"
          else
            git commit -m "chore: package ${ver} [skip ci]"
            git push origin HEAD:master
          fi
          # One immutable tag per packaging (pkgver-pkgrel). Re-runs and forced
          # redeploys of an already-tagged packaging leave the existing tag be;
          # git still allows several tags to point at one commit if it comes to that.
          if git rev-parse -q --verify "refs/tags/${ver}" >/dev/null; then
            echo "::notice::tag ${ver} already exists, leaving it"
          else
            git tag -a "${ver}" -m "release ${ver}"
            git push origin "${ver}"
            echo "::notice::tagged ${ver}"
          fi

      - name: Deploy to AUR
        if: steps.check.outputs.deploy == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: garm-bin
          pkgbuild: ./PKGBUILD
          assets: |
            garm-bin.install
            garm.service
            garm.sysusers
            garm.tmpfiles
            .gitignore
          commit_username: ${{ vars.AUR_USERNAME }}
          commit_email: ${{ vars.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.pkg.outputs.ver }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
